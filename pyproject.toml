[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-intelligence-platform"
version = "0.1.0"
description = "Fog-edge vehicle fleet intelligence platform"
requires-python = ">=3.11"
dependencies = [
	"PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
	"pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
