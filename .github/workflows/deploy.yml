name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      role_to_assume:
        description: IAM role ARN trusted for GitHub OIDC deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: eu-west-1
      - run: python -m pip install -r infrastructure/requirements.txt
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx aws-cdk@2 diff --app 'python infrastructure/app.py'
      - run: npx aws-cdk@2 deploy --app 'python infrastructure/app.py' --require-approval never